<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore Landing Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Bookstore</a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#shop">Shop</a></li>
                    <li><a href="#blog">Blog</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero-split">
            <div class="container">
                <div class="hero-left">
                    <h1>Find Your Next Great Read.</h1>
                    <p>Discover worlds of adventure, romance, and mystery. A calm reading experience awaits.</p>
                    <a href="#shop" class="cta-button">Browse Featured Books</a>
                </div>
                
                <div class="hero-right">
                    <div class="featured-book">
                        <img src="https://via.placeholder.com/150x220" alt="Book Cover 1">
                        <p>Book Title 1</p>
                    </div>
                    <div class="featured-book">
                        <img src="https://via.placeholder.com/150x220" alt="Book Cover 2">
                        <p>Book Title 2</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
